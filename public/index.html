<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Super Agent</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#7c3aed; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0%,#21134a 0,transparent 35%),var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
    main { max-width:900px; margin:0 auto; padding:48px 20px 28px; display:flex; flex-direction:column; min-height:100vh; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:28px; } h1 { margin:0; font-size:30px; letter-spacing:-.04em } .sub { color:var(--muted); margin-top:5px } .status { color:#7ee787; font-size:13px; border:1px solid #238636; padding:5px 9px; border-radius:999px; white-space:nowrap; }
    #messages { flex:1; display:flex; flex-direction:column; gap:14px; padding:10px 0 24px; } .empty { color:var(--muted); text-align:center; margin:auto; max-width:420px; } .empty strong { color:var(--text); display:block; font-size:20px; margin-bottom:8px; }
    .message { max-width:78%; padding:13px 16px; border:1px solid var(--line); border-radius:16px; white-space:pre-wrap; } .user { align-self:flex-end; background:#2b1b55; border-color:#5b32a8; } .assistant { align-self:flex-start; background:var(--panel); }
    form { display:flex; gap:10px; border:1px solid var(--line); background:rgba(22,27,34,.9); border-radius:16px; padding:10px; } textarea { flex:1; resize:none; min-height:46px; max-height:160px; border:0; outline:0; background:transparent; color:var(--text); font:inherit; padding:11px 8px; } button { align-self:flex-end; background:var(--accent); border:0; border-radius:10px; color:white; padding:11px 17px; cursor:pointer; font-weight:600; } button:disabled { opacity:.5; cursor:wait; } footer { color:var(--muted); font-size:12px; padding-top:12px; }
  </style>
</head>
<body><main>
  <header><div><h1>AI Super Agent</h1><div class="sub">A focused workspace for turning a thought into the next useful action.</div></div><div class="status" id="status">checking runtime…</div></header>
  <section id="messages"><div class="empty" id="empty"><strong>What should we move forward?</strong>Ask for a plan, a draft, an explanation, or a concrete next step.</div></section>
  <form id="chat"><textarea id="input" placeholder="Give the agent a task…" autofocus></textarea><button id="send" type="submit">Send</button></form>
  <footer id="meta">Mock mode is active until a model provider is configured.</footer>
</main>
<script>
  const messages = document.querySelector('#messages'); const empty = document.querySelector('#empty'); const input = document.querySelector('#input'); const send = document.querySelector('#send'); const status = document.querySelector('#status'); const meta = document.querySelector('#meta');
  let conversationId = localStorage.getItem('super-agent-conversation') || undefined;
  function add(role, text) { if (empty) empty.remove(); const item = document.createElement('div'); item.className = 'message ' + role; item.textContent = text; messages.appendChild(item); item.scrollIntoView({ behavior:'smooth', block:'end' }); }
  fetch('/health').then(r=>r.json()).then(data=> { status.textContent = data.provider === 'mock' ? 'mock mode' : data.provider + ' connected'; meta.textContent = data.provider === 'mock' ? 'Set LLM_PROVIDER, LLM_BASE_URL, LLM_API_KEY, and LLM_MODEL to connect a real model.' : 'Connected to ' + data.model; }).catch(() => status.textContent = 'offline');
  document.querySelector('#chat').addEventListener('submit', async (event) => { event.preventDefault(); const message = input.value.trim(); if (!message || send.disabled) return; add('user', message); input.value = ''; send.disabled = true; send.textContent = 'Thinking…'; try { const response = await fetch('/chat', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ conversationId, message }) }); const data = await response.json(); if (!response.ok || !data.ok) throw new Error(data.error || 'Request failed'); conversationId = data.conversationId; localStorage.setItem('super-agent-conversation', conversationId); add('assistant', data.message); } catch (error) { add('assistant', 'Could not complete that request: ' + error.message); } finally { send.disabled = false; send.textContent = 'Send'; input.focus(); } });
  input.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.querySelector('#chat').requestSubmit(); } });
</script></body></html>
